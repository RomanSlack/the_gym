<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Gym · equipment list</title>
<style>
:root{--bg:#141312;--panel:#1c1b19;--line:#2c2a27;--ink:#e9e4dc;--mute:#8d867c;--oak:#c9a46a;--ok:#8fb08a;--skip:#6b6660}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 ui-sans-serif,system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(20,19,18,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
h1{font:600 17px/1 ui-serif,Georgia,serif;letter-spacing:.02em;margin:0 8px 0 0}
#prog{color:var(--mute);font-variant-numeric:tabular-nums}
#bar{flex:0 0 160px;height:4px;background:var(--line);border-radius:2px;overflow:hidden}#bar i{display:block;height:100%;background:var(--oak);width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0}.seg button.on{background:#2d2a26;color:var(--ink)}
button,input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px}
button{cursor:pointer;color:var(--mute)}button:hover{color:var(--ink);border-color:#4a463f}
input:focus{outline:1px solid var(--oak);border-color:transparent}
#q{width:220px}label{color:var(--mute);display:flex;gap:6px;align-items:center;cursor:pointer}
#off{display:none;background:#4a2a20;color:#f3d2c4;padding:8px 22px}
main{max-width:1180px;margin:0 auto;padding:10px 22px 80px}
section{margin-top:26px}
h2{font:600 13px/1 ui-sans-serif,system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--oak);margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
h2 small{color:var(--mute);letter-spacing:0;text-transform:none;font-weight:400}
.row{display:grid;grid-template-columns:22px minmax(220px,1.4fr) 56px minmax(120px,.8fr) 176px minmax(220px,1.3fr);gap:10px;align-items:center;padding:7px 8px;border-top:1px solid var(--line)}
.row:hover{background:var(--panel)}
.dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--mute);cursor:pointer}
.found .dot{background:var(--ok);border-color:var(--ok)}.skipped .dot{background:var(--skip);border-color:var(--skip)}
.skipped .name{color:var(--skip);text-decoration:line-through}
.name{cursor:copy}.maybe{font-size:11px;color:var(--oak);border:1px solid #5a4a30;border-radius:4px;padding:0 5px;margin-left:6px}
.qty{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}.zone{color:var(--mute);font-size:12.5px}
.acts{display:flex;gap:4px}.acts button{padding:3px 8px;font-size:12.5px}
.links{display:flex;flex-direction:column;gap:5px}
.links input{width:100%;padding:4px 8px;font-size:12.5px}
.chip{display:flex;gap:7px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12.5px;min-width:0}
.chip img{width:28px;height:28px;object-fit:cover;border-radius:3px;flex:none}
.chip a{color:var(--ink);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.chip a:hover{color:var(--oak)}
.chip b{font-weight:400;color:var(--mute)}.chip button{border:0;padding:0 4px}
.add{margin-top:8px;display:flex;gap:6px}.add input{flex:1;max-width:420px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2d2a26;padding:7px 14px;border-radius:6px;opacity:0;transition:opacity .2s}
.hide{display:none}
</style>
<div id="off">Not saving: the server isn't running. Start it with <code>python3 equipment/serve.py</code> and reload.</div>
<header>
  <h1>The Gym · equipment</h1>
  <div id="bar"><i></i></div><span id="prog"></span>
  <div class="seg" id="filter"><button data-f="all" class="on">All</button><button data-f="open">To find</button><button data-f="found">Found</button></div>
  <label><input type="checkbox" id="maybes" checked> show maybes</label>
  <input id="q" placeholder="Filter…  ( / )">
</header>
<main id="main"></main>
<div id="toast"></div>
<script>
let L, P, filter = 'all';
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast = m => { const t = $('#toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.opacity = 0, 1300) };
const short = n => n.split(/[(,]/)[0].replace(/\b(set|pair)\b/gi, '').trim();
const pick = id => P.items[id] || {links: [], skipped: false};
const state = id => pick(id).links.length ? 'found' : pick(id).skipped ? 'skipped' : 'open';

async function act(a) {
  try {
    const r = await fetch('/api/act', {method: 'POST', body: JSON.stringify(a)});
    P = (await r.json()).picks; render();
  } catch (e) { $('#off').style.display = 'block' }
}
async function load() {
  try { const r = await (await fetch('/api/state')).json(); L = r.list; P = r.picks; render() }
  catch (e) { $('#off').style.display = 'block' }
}
function cats() {
  return L.categories.map(c => ({...c, items: [...c.items, ...P.custom.filter(x => x.cat === c.id).map(x => ({...x, custom: true}))]}));
}
function render() {
  const q = $('#q').value.toLowerCase(), showMaybe = $('#maybes').checked;
  let all = 0, done = 0, html = '';
  for (const c of cats()) {
    let rows = '', n = 0, nd = 0;
    for (const it of c.items) {
      const s = state(it.id);
      all++; n++; if (s !== 'open') { done++; nd++ }
      const vis = (showMaybe || !it.maybe) && (filter === 'all' || (filter === 'open' ? s === 'open' : s === 'found'))
        && (!q || (it.name + ' ' + it.zone + ' ' + c.name).toLowerCase().includes(q));
      const p = pick(it.id);
      rows += `<div class="row ${s} ${vis ? '' : 'hide'}" data-id="${it.id}">
        <div class="dot" title="click: skip / unskip"></div>
        <div class="name" title="click to copy">${esc(it.name)}${it.maybe ? '<span class="maybe">maybe</span>' : ''}${it.custom ? '<span class="maybe">added</span>' : ''}</div>
        <div class="qty">×${esc(it.qty)}</div>
        <div class="zone">${esc(it.zone)}</div>
        <div class="acts"><button data-a="shop" title="Google Shopping, new tab">Shop</button><button data-a="google" title="Google search, new tab">Web</button><button data-a="copy">Copy</button>${it.custom ? '<button data-a="del" title="remove this added item">✕</button>' : ''}</div>
        <div class="links">${p.links.map(l => `<div class="chip">${l.ref ? `<img src="${esc(l.ref)}">` : ''}<a href="${esc(l.url)}" target="_blank" rel="noopener" title="${esc(l.url)}">${esc(l.title || l.url.replace(/^https?:\/\/(www\.)?/, ''))}</a><b>${esc(new URL(l.url).hostname.replace(/^www\./, ''))}</b><button data-a="unlink" data-url="${esc(l.url)}" title="remove link">✕</button></div>`).join('')}
          <input placeholder="${p.links.length ? 'another link…' : 'paste link…'}"></div></div>`;
    }
    html += `<section data-cat="${c.id}"><h2>${esc(c.name)} <small>${nd} / ${n}</small></h2>${rows}
      <div class="add"><input placeholder="+ add an item to ${esc(c.name.toLowerCase())}  (name, qty)"></div></section>`;
  }
  const y = scrollY, focus = document.activeElement?.closest('.row')?.dataset.id;
  $('#main').innerHTML = html; scrollTo(0, y);
  if (focus) document.querySelector(`.row[data-id="${focus}"] .links input`)?.focus();
  $('#prog').textContent = `${done} / ${all} found or skipped`;
  $('#bar i').style.width = (100 * done / all) + '%';
}
function addLink(id, v) {
  v = v.trim(); if (!/^https?:\/\//i.test(v)) { toast('Not a link'); return }
  act({action: 'add_link', id, url: v}); toast('Saved');
}
document.addEventListener('click', e => {
  const row = e.target.closest('.row'); if (!row) return;
  const id = row.dataset.id, it = cats().flatMap(c => c.items).find(x => x.id === id), a = e.target.dataset.a;
  if (e.target.classList.contains('dot')) act({action: 'skip', id, value: !pick(id).skipped});
  else if (e.target.closest('.name') || a === 'copy') { navigator.clipboard.writeText(it.name); toast('Copied') }
  else if (a === 'shop') open('https://www.google.com/search?tbm=shop&q=' + encodeURIComponent(short(it.name) + ' commercial gym'), '_blank');
  else if (a === 'google') open('https://www.google.com/search?q=' + encodeURIComponent(short(it.name) + ' premium commercial gym equipment'), '_blank');
  else if (a === 'unlink') act({action: 'remove_link', id, url: e.target.dataset.url});
  else if (a === 'del' && confirm('Remove ' + it.name + '?')) act({action: 'remove_item', id});
});
document.addEventListener('paste', e => {
  const inp = e.target.closest('.links input'); if (!inp) return;
  const v = e.clipboardData.getData('text'); if (/^https?:\/\//i.test(v.trim())) { e.preventDefault(); addLink(inp.closest('.row').dataset.id, v) }
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); return }
  if (e.key !== 'Enter') return;
  const inp = e.target;
  if (inp.closest('.links')) addLink(inp.closest('.row').dataset.id, inp.value);
  else if (inp.closest('.add')) {
    const m = inp.value.trim().match(/^(.*?)(?:,\s*(\d+))?$/); if (!m || !m[1]) return;
    const cat = inp.closest('section').dataset.cat;
    act({action: 'add_item', id: 'x-' + m[1].toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '-' + Date.now().toString(36), cat, name: m[1], qty: +(m[2] || 1)});
  }
});
$('#filter').onclick = e => { if (!e.target.dataset.f) return; filter = e.target.dataset.f; [...$('#filter').children].forEach(b => b.classList.toggle('on', b === e.target)); render() };
$('#maybes').onchange = render; $('#q').oninput = render;
setInterval(() => { if (!document.activeElement?.matches('input')) load() }, 8000);  // pick up fetched titles + images
load();
</script>
